name: deterministic-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit package
        run: python3 scripts/audit_package.py .
      - name: Run script tests
        run: python3 -m unittest discover -s tests -v
